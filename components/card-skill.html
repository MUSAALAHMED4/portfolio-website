<!-- Skill Bar Component Template -->
<div class="skill">
  <div class="skill-head">
    <span class="skill-name">Yetenek Adı</span>
    <span class="skill-percent">80%</span>
  </div>
  <div
    class="skill-bar"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="80"
  >
    <span class="skill-fill" style="width: 80%"></span>
  </div>
</div>
